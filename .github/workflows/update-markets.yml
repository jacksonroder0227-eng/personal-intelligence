name: Update Markets

on:
  schedule:
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-markets:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Get market data
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import json
          from datetime import datetime, timezone

          symbols = {
              "sp500": "^GSPC",
              "nasdaq": "^IXIC",
              "dow": "^DJI",
              "russell2000": "^RUT",
              "vix": "^VIX",
              "treasury10y": "^TNX",
              "oil": "CL=F",
              "gold": "GC=F"
          }

          result = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "indices": {},
              "rates": {},
              "commodities": {},
              "volatility": {}
          }

          def get_quote(symbol):

              encoded = urllib.parse.quote(symbol, safe="")

              url = (
                  "https://query1.finance.yahoo.com/v8/finance/chart/"
                  + encoded
                  + "?interval=1d&range=5d"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )

              response = urllib.request.urlopen(
                  request,
                  timeout=20
              )

              data = json.loads(
                  response.read().decode("utf-8")
              )

              chart = data.get("chart", {})
              results = chart.get("result")

              if not results:
                  raise Exception(
                      "No result returned for " + symbol
                  )

              meta = results[0].get("meta", {})

              price = meta.get("regularMarketPrice")
              previous = meta.get("chartPreviousClose")

              if price is None:
                  raise Exception(
                      "No price returned for " + symbol
                  )

              change = None
              change_percent = None

              if previous is not None and previous != 0:

                  change = price - previous

                  change_percent = (
                      (price - previous)
                      / previous
                  ) * 100

              return {
                  "value": price,
                  "previousClose": previous,
                  "change": change,
                  "changePercent": change_percent
              }


          for name, symbol in symbols.items():

              try:

                  quote = get_quote(symbol)

                  print(name, quote)

                  if name in [
                      "sp500",
                      "nasdaq",
                      "dow",
                      "russell2000"
                  ]:

                      result["indices"][name] = quote

                  elif name == "treasury10y":

                      result["rates"][name] = quote

                  elif name in [
                      "oil",
                      "gold"
                  ]:

                      result["commodities"][name] = quote

                  elif name == "vix":

                      result["volatility"][name] = quote

              except Exception as error:

                  print(
                      "FAILED:",
                      name,
                      error
                  )


          with open(
              "markets.json",
              "w"
          ) as file:

              json.dump(
                  result,
                  file,
                  indent=2
              )


          print(
              "Market update complete."
          )

          PY

      - name: Save market data
        run: |
          git config user.name "Personal Intelligence"
          git config user.email "actions@github.com"

          git add markets.json

          git diff --cached --quiet || \
          git commit -m "Update market data"

          git push
