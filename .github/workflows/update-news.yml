name: Update News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Download news
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          from datetime import datetime, timezone

          feeds = {
              "world": [
                  "https://feeds.bbci.co.uk/news/world/rss.xml",
                  "https://rss.nytimes.com/services/xml/rss/nyt/World.xml"
              ],
              "finance": [
                  "https://feeds.bbci.co.uk/news/business/rss.xml",
                  "https://rss.nytimes.com/services/xml/rss/nyt/Business.xml"
              ],
              "markets": [
                  "https://feeds.bbci.co.uk/news/business/market-data/rss.xml"
              ]
          }

          result = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "world": [],
              "finance": [],
              "markets": []
          }

          for category, urls in feeds.items():
              for url in urls:
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "Mozilla/5.0"}
                      )

                      data = urllib.request.urlopen(
                          request,
                          timeout=20
                      ).read()

                      root = ET.fromstring(data)

                      for item in root.findall(".//item"):
                          title = item.findtext("title")
                          link = item.findtext("link")
                          pubdate = item.findtext("pubDate")

                          if title and link:
                              result[category].append({
                                  "title": title.strip(),
                                  "link": link.strip(),
                                  "published": pubdate
                              })

                  except Exception as e:
                      print("Feed failed:", url, e)

          for category in result:
              if category != "updated":
                  seen = set()
                  clean = []

                  for story in result[category]:
                      if story["title"] not in seen:
                          seen.add(story["title"])
                          clean.append(story)

                  result[category] = clean[:10]

          with open("news.json", "w") as f:
              json.dump(result, f, indent=2)

          print("News updated successfully")
          PY

      - name: Save news
        run: |
          git config user.name "Personal Intelligence"
          git config user.email "actions@github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Update news"
          git push
